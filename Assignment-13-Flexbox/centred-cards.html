<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Centred Cards with Flexbox</title>
  <style>
    .row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      min-height: 300px;
      background-color: #f4f6f8;
    }

    .card {
      border: 1px solid #1d3557;
      background-color: #ffffff;
      padding: 20px;
      width: 140px;
      text-align: center;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <h1>Membership Plans</h1>
  <div class="row">
    <div class="card">
      <h3>Starter</h3>
      <p>Price: 199</p>
    </div>
    <div class="card">
      <h3>Standard</h3>
      <p>Price: 349</p>
    </div>
    <div class="card">
      <h3>Premium</h3>
      <p>Price: 499</p>
    </div>
  </div>
</body>
</html>
