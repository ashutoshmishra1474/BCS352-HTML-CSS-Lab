<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Units</title>
  <style>
    .box-px {
      width: 200px;
      height: 40px;
      background-color: #a8dadc;
      margin-bottom: 12px;
      line-height: 40px;
      padding-left: 8px;
    }

    .box-percent {
      width: 50%;
      height: 40px;
      background-color: #f4a261;
      margin-bottom: 16px;
      line-height: 40px;
      padding-left: 8px;
    }

    p {
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <h1>CSS Measurement Units</h1>
  <div class="box-px">Width: 200px, Height: 40px</div>
  <div class="box-percent">Width: 50%, Height: 40px</div>
  <p>This paragraph uses a relative font size of 1.5rem.</p>
</body>
</html>
