<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Typography</title>
  <style>
    body {
      font-size: 1rem;
      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: 1.5rem;
    }

    @media (min-width: 600px) {
      h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <h1>Responsive Heading Size</h1>
  <p>This body paragraph stays at 1rem, while the h1 heading grows from 1.5rem on mobile to 2.5rem at 600px and wider.</p>
</body>
</html>
