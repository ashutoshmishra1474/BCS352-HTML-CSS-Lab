<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Grid Areas</title>
  <style>
    .dashboard {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-areas:
        "header header"
        "sidebar main"
        "footer footer";
      gap: 10px;
      font-family: Arial, sans-serif;
    }

    .header {
      grid-area: header;
      background-color: #1d3557;
      color: #ffffff;
      padding: 16px;
    }

    .sidebar {
      grid-area: sidebar;
      background-color: #a8dadc;
      padding: 16px;
      min-height: 150px;
    }

    .main {
      grid-area: main;
      background-color: #f1faee;
      padding: 16px;
      min-height: 150px;
    }

    .footer {
      grid-area: footer;
      background-color: #457b9d;
      color: #ffffff;
      padding: 12px 16px;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <header class="header">Dashboard Header</header>
    <aside class="sidebar">Sidebar Menu</aside>
    <main class="main">Main Content Area</main>
    <footer class="footer">Dashboard Footer</footer>
  </div>
</body>
</html>
