<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inline and Internal CSS</title>
  <style>
    h1 {
      color: navy;
    }

    .highlight {
      background-color: yellow;
    }
  </style>
</head>
<body>
  <h1>CSS Fundamentals</h1>
  <p style="color: red;">This paragraph uses inline CSS to display red text.</p>
  <p class="highlight">This paragraph uses an internal CSS class for a yellow background highlight.</p>
</body>
