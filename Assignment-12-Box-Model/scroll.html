<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Overflow Scroll</title>
  <style>
    .scroll-box {
      height: 120px;
      width: 280px;
      overflow: auto;
      border: 2px solid #1d3557;
      padding: 10px;
    }

    .scroll-box p {
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <h1>Overflow Auto Example</h1>
  <div class="scroll-box">
    <p>Line 1</p>
    <p>Line 2</p>
    <p>Line 3</p>
    <p>Line 4</p>
    <p>Line 5</p>
  </div>
</body>
</html>
